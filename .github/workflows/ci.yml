# CI: runs on every pull request to main, and again after each merge to main.
# Explained line by line in docs/learning/ci-cd.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on GitHub: runs every job

# Least privilege: jobs can read the code and nothing else.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-pointless run.
# Runs on main are never cancelled, so every merge gets checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which parts of the repo changed, so later jobs can skip.
  # Filtering at job level (not with `on: paths:`) means a skipped job still
  # reports a result, and the required "CI passed" check never hangs.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so we can diff against the base commit
          persist-credentials: false

      - name: List changed folders
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          echo "Changed files:"; echo "$CHANGED"

          # Backend jobs run when the API or this workflow changes.
          if echo "$CHANGED" | grep -qE '^(apps/api/|\.github/workflows/ci\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  # Backend: lint, format, types, tests. Same commands as on the laptop.
  api:
    name: API · lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      # The app refuses to start without these (app/core/config.py).
      # Dummy values: tests never reach a real service.
      ENVIRONMENT: test
      PLATFORM_NAME: Aliquot
      PLATFORM_DOMAIN: localhost
      TENANT_MODE: path
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (with download cache)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          cache-python: true

      - name: Install Python 3.13 and dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run ruff check . --output-format=github

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy .

      - name: Tests (pytest)
        run: uv run pytest
