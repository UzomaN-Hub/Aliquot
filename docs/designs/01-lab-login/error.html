<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"tertiary":"#5d577f","on-primary-fixed":"#400011","surface-dim":"#dcdad3","surface-container":"#f1eee7","on-background":"#1c1c18","outline-variant":"#debfc1","on-secondary-container":"#5a5480","tertiary-fixed":"#e5deff","on-surface-variant":"#574143","tertiary-fixed-dim":"#c9c1ef","inverse-on-surface":"#f3f0e9","primary":"#a92c48","secondary":"#5e5985","on-secondary-fixed":"#1b163d","primary-fixed-dim":"#ffb2ba","secondary-fixed-dim":"#c8c1f3","inverse-surface":"#31312c","background":"#fcf9f2","surface":"#fcf9f2","tertiary-container":"#766f99","on-tertiary-fixed-variant":"#474268","primary-fixed":"#ffd9dc","error":"#ba1a1a","surface-container-highest":"#e5e2db","on-primary":"#ffffff","surface-bright":"#fcf9f2","on-tertiary":"#ffffff","on-error":"#ffffff","on-secondary-fixed-variant":"#47426c","on-secondary":"#ffffff","surface-tint":"#ac2f4a","on-tertiary-container":"#fffbff","surface-variant":"#e5e2db","on-tertiary-fixed":"#1c163a","primary-container":"#ca455f","outline":"#8b7173","secondary-fixed":"#e5deff","secondary-container":"#d3ccff","inverse-primary":"#ffb2ba","on-error-container":"#93000a","on-surface":"#1c1c18","on-primary-fixed-variant":"#8b1334","on-primary-container":"#fffbff","error-container":"#ffdad6","surface-container-low":"#f6f3ec","surface-container-high":"#ebe8e1","surface-container-lowest":"#ffffff"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"gutter":"1.5rem","margin-tablet":"2rem","space-lg":"1.5rem","space-xs":"0.25rem","gutter-mobile":"0.75rem","space-sm":"0.5rem","space-md":"1rem","margin-mobile":"1rem","margin":"3rem","space-xl":"2.5rem"}}}};</script></head><body class="bg-[#F6F3EC] text-[#221D45] antialiased min-h-screen flex flex-col justify-center items-center" style="font-family: 'Atkinson Hyperlegible', sans-serif;"><main class="w-full flex-1 flex flex-col justify-center items-center px-margin-mobile md:px-margin-tablet lg:px-margin py-margin"><div class="flex flex-col w-full h-full">
<div class="w-full flex-1 flex flex-col justify-between items-center py-space-xl min-h-[calc(100vh-6rem)]">
<!-- Spacer to place column slightly above vertical center -->
<div class="hidden sm:block h-6"></div>
<!-- Centered Editorial Ledger Form -->
<div class="w-full max-w-[380px] mx-auto flex flex-col justify-center items-stretch my-auto">
<!-- Header Block -->
<div class="text-center mb-6">
<h1 class="text-[32px] leading-[38px] font-normal text-[#221D45] tracking-tight mb-1.5" style="font-family: 'Instrument Serif', Georgia, serif;">
          Demo Diagnostic Laboratory
        </h1>
<p class="text-[15px] leading-6 text-[#5e5985]" style="font-family: 'Atkinson Hyperlegible', sans-serif;">
          Sign in to continue
        </p>
</div>
<!-- Inline Error Notice Above Email Field -->
<div class="mb-5 flex items-start gap-1.5 text-[13px] leading-[18px] text-[#C23E58]" style="font-family: 'Atkinson Hyperlegible', sans-serif;">
<span class="font-bold select-none text-[13px] leading-[18px]">!</span>
<span>That email and password don't match. Try again or reset your password.</span>
</div>
<!-- Authentication Form -->
<form class="w-full space-y-4" id="auth-form" onsubmit="event.preventDefault();">
<!-- Field 1: Specimen / Operator Email -->
<div class="flex flex-col space-y-1.5">
<label class="text-[14px] leading-5 text-[#221D45]" for="identity" style="font-family: 'Atkinson Hyperlegible', sans-serif;">
            Email
          </label>
<input autocomplete="email" class="w-full h-12 rounded-[10px] px-4 bg-transparent text-[#221D45] text-[15px] outline-none transition-colors border border-[#E4DFD3] focus:border-[#221D45] focus:bg-white" id="identity" name="email" placeholder="operator@demo-lab.example" required="" spellcheck="false" style="font-family: 'Atkinson Hyperlegible', sans-serif;" type="email" value="operator@demo-lab.example"/>
</div>
<!-- Field 2: Keyphrase / Password -->
<div class="flex flex-col space-y-1.5">
<div class="flex justify-between items-baseline">
<label class="text-[14px] leading-5 text-[#221D45]" for="passcode" style="font-family: 'Atkinson Hyperlegible', sans-serif;">
              Password
            </label>
</div>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-12 rounded-[10px] pl-4 pr-16 bg-transparent text-[#221D45] text-[15px] outline-none transition-colors border border-[#C23E58] focus:border-[#C23E58] focus:bg-white" id="passcode" name="password" required="" style="font-family: 'Atkinson Hyperlegible', sans-serif;" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 text-[#4A4470] hover:text-[#221D45] text-[13px] underline underline-offset-4 cursor-pointer select-none bg-transparent border-0 p-0 transition-colors" id="visibility-toggle" style="font-family: 'Atkinson Hyperlegible', sans-serif;" type="button">
              Show
            </button>
</div>
</div>
<!-- Singular Primary Submission Action -->
<div class="pt-2">
<button class="w-full h-12 rounded-[10px] bg-[#221D45] text-white text-[15px] font-normal hover:bg-[#342D66] transition-colors cursor-pointer flex items-center justify-center select-none" id="submit-btn" style="font-family: 'Atkinson Hyperlegible', sans-serif;" type="submit">
            Sign in
          </button>
</div>
<!-- Secondary Bare Hyperlink -->
<div class="text-center pt-2">
<a class="text-[13px] text-[#4A4470] hover:text-[#221D45] underline underline-offset-4 transition-colors" href="#recovery" style="font-family: 'Atkinson Hyperlegible', sans-serif;">
            Forgot password?
          </a>
</div>
</form>
</div>
<!-- Editorial System Groundline -->
<div class="w-full text-center pt-space-xl select-none text-[12px] leading-4 text-[#8A85A3]" style="font-family: 'Atkinson Hyperlegible', sans-serif; letter-spacing: normal;">Powered by Aliquot</div>
</div>
<script>
    (function initAuthInteractions() {
      const toggleBtn = document.getElementById('visibility-toggle');
      const passInput = document.getElementById('passcode');
      const authForm = document.getElementById('auth-form');
      const submitBtn = document.getElementById('submit-btn');

      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const isPassword = passInput.getAttribute('type') === 'password';
          passInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleBtn.textContent = isPassword ? 'Hide' : 'Show';
        });
      }

      if (authForm && submitBtn) {
        authForm.addEventListener('submit', function() {
          const originalText = submitBtn.textContent;
          submitBtn.textContent = 'Verifying record...';
          submitBtn.disabled = true;
          setTimeout(function() {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
          }, 1400);
        });
      }
    })();
  </script>
</div></main></body></html>
