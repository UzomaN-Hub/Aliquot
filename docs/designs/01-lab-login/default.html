<div class="w-full flex-1 flex flex-col justify-between items-center py-space-xl min-h-[calc(100vh-6rem)]">
<!-- Top Ledger Reference Stamp -->

<!-- Centered Editorial Ledger Form -->
<div class="w-full max-w-[380px] mx-auto flex flex-col justify-center items-stretch my-auto">
<!-- Header Block -->
<div class="text-center mb-space-xl">
<h1 class="text-headline-lg font-normal text-on-secondary-fixed tracking-tight mb-space-xs" style="font-family: &quot;Instrument Serif&quot;, Georgia, serif;">
          Demo Diagnostic Laboratory
        </h1>
<p class="text-body-lg text-secondary">
          Sign in to continue
        </p>
</div>
<!-- Authentication Form -->
<form class="w-full space-y-space-lg" id="auth-form" onsubmit="event.preventDefault();">
<!-- Field 1: Specimen / Operator Email -->
<div class="flex flex-col space-y-space-xs">
<label class="text-label-md text-on-secondary-fixed" for="identity">
            Email
          </label>
<input autocomplete="email" class="w-full h-12 rounded-full px-space-md bg-transparent text-on-secondary-fixed text-body-md outline-none transition-colors border-0 ring-1 ring-inset ring-surface-dim focus:ring-1.5 focus:ring-on-secondary-fixed focus:bg-surface-container-lowest" id="identity" name="email" placeholder="operator@demo-lab.example" required="" spellcheck="false" type="email" style="font-family: 'Atkinson Hyperlegible', sans-serif; --tw-placeholder-opacity: 1;">
</div>
<!-- Field 2: Keyphrase / Password -->
<div class="flex flex-col space-y-space-xs">
<div class="flex justify-between items-baseline">
<label class="text-label-md text-on-secondary-fixed" for="passcode">
              Password
            </label>

</div>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-12 rounded-full pl-space-md pr-16 bg-transparent text-on-secondary-fixed text-body-md outline-none transition-colors border-0 ring-1 ring-inset ring-surface-dim focus:ring-1.5 focus:ring-on-secondary-fixed focus:bg-surface-container-lowest" id="passcode" name="password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-space-md text-secondary hover:text-on-secondary-fixed text-label-md underline underline-offset-4 cursor-pointer select-none bg-transparent border-0 p-0 transition-colors" id="visibility-toggle" type="button">
              Show
            </button>
</div>
</div>
<!-- Singular Primary Submission Action -->
<div class="pt-space-xs">
<button class="w-full h-12 rounded-full bg-on-secondary-fixed text-surface-container-low text-label-md font-medium tracking-normal hover:bg-secondary transition-colors cursor-pointer flex items-center justify-center select-none" id="submit-btn" type="submit">
            Sign in
          </button>
</div>
<!-- Secondary Bare Hyperlink -->
<div class="text-center pt-space-xs">
<a class="text-label-md text-secondary hover:text-on-secondary-fixed underline underline-offset-4 transition-colors" href="#recovery">
            Forgot password?
          </a>
</div>
</form>
</div>
<!-- Editorial System Groundline -->
<div class="w-full text-center pt-space-xl select-none text-[12px] leading-4" style="color: rgb(138, 133, 163); font-family: &quot;Atkinson Hyperlegible&quot;, sans-serif; letter-spacing: normal;">Powered by Aliquot</div>
</div>
<script>
    (function initAuthInteractions() {
      const toggleBtn = document.getElementById('visibility-toggle');
      const passInput = document.getElementById('passcode');
      const authForm = document.getElementById('auth-form');
      const submitBtn = document.getElementById('submit-btn');

      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const isPassword = passInput.getAttribute('type') === 'password';
          passInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleBtn.textContent = isPassword ? 'Hide' : 'Show';
        });
      }

      if (authForm && submitBtn) {
        authForm.addEventListener('submit', function() {
          const originalText = submitBtn.textContent;
          submitBtn.textContent = 'Verifying record...';
          submitBtn.disabled = true;
          setTimeout(function() {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
          }, 1400);
        });
      }
    })();
  </script>
</div></main>

</body></html>
