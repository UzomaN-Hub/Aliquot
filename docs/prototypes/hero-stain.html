<!doctype html>
<!-- Aliquot hero prototype ("The stain"). Reference only: rebuild as a Next.js client component.
     Set IMAGE_URL to a licensed blood-film image (CC0 or own). The prototype used a CC BY-SA 4.0 Commons image. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aliquot hero prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400&family=Instrument+Serif&display=swap">
<style>
html,body{margin:0;height:100%;background:#221D45;font-family:"Atkinson Hyperlegible Next",sans-serif;color:#F6F3EC;overflow:hidden}
*{box-sizing:border-box}.serif{font-family:"Instrument Serif",serif}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 40px;z-index:3}
#nav .logo{font-size:28px}#nav a{font-size:14px;color:#F6F3EC;text-decoration:none;border-bottom:1px solid rgba(246,243,236,.7)}
#drop,#ring{position:fixed;left:52%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;z-index:2}
#drop{background:#E0566F;opacity:0;animation:fall .65s cubic-bezier(.5,0,.75,0) .6s both,soak .6s ease 1.3s forwards}
@keyframes fall{0%{opacity:1;transform:translateY(-55vh) scale(.85,1.35)}88%{opacity:1;transform:translateY(0) scale(.85,1.3)}100%{opacity:1;transform:scale(1.3,.75)}}
@keyframes soak{to{opacity:0;transform:scale(2.6)}}
#ring{border:1.5px solid #E0566F;opacity:0;animation:ripple 1.2s ease-out 1.25s both}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(9)}}
#copy{position:fixed;left:40px;bottom:48px;max-width:560px;z-index:3}
.h{font-size:clamp(44px,6vw,84px);line-height:.98;letter-spacing:-0.035em;margin:0}
.sub{font-size:17px;line-height:1.55;color:rgba(246,243,236,.82);margin:22px 0 30px;max-width:420px}
.row{display:flex;align-items:center;gap:26px;font-size:14px}
.cta{background:#F6F3EC;color:#221D45;padding:14px 28px;border-radius:999px}
.lnk{border-bottom:1px solid #F6F3EC;padding-bottom:2px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.w{display:inline-block;opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:3.6s}.d2{animation-delay:3.75s}.d3{animation-delay:3.9s}.d4{animation-delay:4.05s}.d5{animation-delay:4.3s}.d6{animation-delay:4.45s}
#dot{display:inline-block;width:.15em;height:.15em;border-radius:50%;background:#E0566F;margin-left:.04em;opacity:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1) 4.5s both}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@media (max-width:700px){#nav{padding:20px}#copy{left:20px;right:20px;bottom:32px}}
@media (prefers-reduced-motion:reduce){.anim,.w,#dot{animation:none!important;opacity:1!important;transform:none!important}#drop,#ring{display:none}}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="nav"><span class="serif logo">Aliquot</span><a href="#">Sign in</a></div>
<div id="drop" class="anim"></div><div id="ring" class="anim"></div>
<div id="copy">
  <h1 class="serif h"><span class="w d1">Every</span> <span class="w d2">sample,</span> <span class="w d3">accounted</span> <span class="w d4">for</span><span id="dot"></span></h1>
  <p class="w d5 sub">From the front desk to the verified result, one calm system your whole lab can trust.</p>
  <div class="w d6 row"><a class="cta">Book a demo</a><a class="lnk">See how it works</a></div>
</div>
<script>
const IMAGE_URL = "REPLACE_WITH_LICENSED_BLOOD_FILM.jpg";
const ORIGIN = [0.52, 0.5];           // drop landing point (screen fraction)
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("cv"), gl = cv.getContext("webgl");

const VS = "attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}";
const FS = `precision highp float;varying vec2 v;uniform sampler2D t;uniform vec2 res,isz,org;uniform float pH,pE,ov;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
void main(){
  vec2 sc=res/isz;float s=max(sc.x,sc.y);vec2 uv=(v*res-(res-isz*s)*.5)/(isz*s);uv.y=1.-uv.y;   // cover fit
  vec3 c=texture2D(t,uv).rgb;float l=dot(c,vec3(.299,.587,.114));
  vec3 bone=vec3(.965,.953,.925);
  vec3 U=mix(bone,vec3(.74,.725,.70),clamp((1.-l)*1.1,0.,1.));                                   // unstained look
  float hw=smoothstep(-.02,.12,c.b-c.r)*smoothstep(.85,.35,l);                                    // purple-staining parts
  vec2 q=v*res/min(res.x,res.y);vec2 o=org*res/min(res.x,res.y);float d=length(q-o)/1.3;
  float tH=d+(fbm(q*3.)-.5)*.55+.05;float tE=d+(fbm(q*3.+17.)-.5)*.55+.05;                       // organic fronts
  float mh=smoothstep(tH-.06,tH,pH)*hw;float me=smoothstep(tE-.08,tE,pE);
  vec3 col=mix(U,c,mh);col=mix(col,c,me);
  col=mix(col,vec3(.133,.114,.271),ov);                                                            // Haematoxylin overlay
  gl_FragColor=vec4(col,1);}`;

function shader(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const pr=gl.createProgram();gl.attachShader(pr,shader(gl.VERTEX_SHADER,VS));gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=k=>gl.getUniformLocation(pr,k);

function size(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height);}
const eo=t=>1-Math.pow(1-t,3), cl=x=>Math.max(0,Math.min(1,x));
let W=0,H=0,last=[1.6,1.6,.42],t0=0;

function paint([a,b,o]){gl.uniform2f(U("res"),cv.width,cv.height);gl.uniform2f(U("isz"),W,H);gl.uniform2f(U("org"),...ORIGIN);
  gl.uniform1f(U("pH"),a);gl.uniform1f(U("pE"),b);gl.uniform1f(U("ov"),o);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

function frame(now){if(!t0)t0=now;const t=(now-t0)/1000;
  cv.style.filter=`blur(${Math.max(0,7*(1-t/1.2)).toFixed(2)}px)`;
  last=[eo(cl((t-1.3)/2.4))*1.6, eo(cl((t-2.1)/2.6))*1.6, .12+.30*eo(cl((t-3.0)/1.2))];
  paint(last);
  if(t<4.8)requestAnimationFrame(frame);else cv.style.filter="none";}

const img=new Image();img.crossOrigin="anonymous";
img.onload=()=>{W=2048;H=Math.round(img.height*2048/img.width);
  const oc=document.createElement("canvas");oc.width=W;oc.height=H;oc.getContext("2d").drawImage(img,0,0,W,H);
  const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,oc);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  size();addEventListener("resize",()=>{size();paint(last);});
  if(reduce)paint(last);else requestAnimationFrame(frame);};
img.src=IMAGE_URL;
</script>
</body>
</html>
